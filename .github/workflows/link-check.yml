name: Weekly link check

# Pull-request CI is hermetic on purpose — tools/browser-check.mjs ignores
# external resource failures so a slow third-party host can never make a PR
# flaky. The cost is that link rot in a published deck goes unnoticed, so it
# is checked here instead, on a schedule, away from the merge path.
#
# The job's own status stays green: a dead link is reported by opening (or
# updating) an issue, not by turning the run red. The issue is the signal.
#
# GitHub only runs scheduled workflows from the default branch, and disables
# the schedule after 60 days without repository activity — re-enable it from
# the Actions tab if that ever happens.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

env:
  LABEL: link-rot
  TITLE: Dead links in the published decks

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Probe every external link in the published decks
        id: check
        run: |
          status=0
          python3 tools/check-links.py \
            --markdown report.md --json report.json || status=$?
          # 1 means "links are dead" — anything else means the checker itself
          # broke, which should be a red run rather than a misleading issue.
          if [ "$status" -gt 1 ]; then
            echo "::error::tools/check-links.py exited with status $status"
            exit "$status"
          fi
          echo "dead=$status" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(sed -n 's/.*fingerprint=\([0-9a-z]*\).*/\1/p' report.md | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload the report
        uses: actions/upload-artifact@v6
        with:
          name: link-check-report
          path: |
            report.md
            report.json
          if-no-files-found: ignore

      # One issue, reused. If the same links are still dead next week the body
      # is refreshed silently; a comment is added only when the set of dead
      # links actually changes, so a long-lived issue does not collect 52
      # identical "still broken" notes a year.
      - name: Open or update the tracking issue
        if: steps.check.outputs.dead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEW_FINGERPRINT: ${{ steps.check.outputs.fingerprint }}
        run: |
          gh label create "$LABEL" --color d93f0b \
            --description "Dead links found by the weekly link check" || true
          number=$(gh issue list --label "$LABEL" --state open --limit 1 \
                     --json number --jq '.[0].number // empty' || true)
          if [ -z "$number" ]; then
            url=$(gh issue create --title "$TITLE" --label "$LABEL" --body-file report.md)
            echo "::warning::dead links found — opened $url"
            exit 0
          fi
          old=$(gh issue view "$number" --json body --jq .body \
                  | sed -n 's/.*fingerprint=\([0-9a-z]*\).*/\1/p' | head -1)
          gh issue edit "$number" --body-file report.md
          if [ "$old" != "$NEW_FINGERPRINT" ]; then
            gh issue comment "$number" --body \
              "The set of dead links changed — the report above has been updated ([run]($RUN_URL))."
          fi
          echo "::warning::dead links found — see issue #$number"

      - name: Close the tracking issue once the links resolve again
        if: steps.check.outputs.dead == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --label "$LABEL" --state open --limit 1 \
                     --json number --jq '.[0].number // empty' || true)
          if [ -n "$number" ]; then
            gh issue close "$number" --comment \
              "Every external link resolved again in this week's check ([run]($RUN_URL)) — closing."
          fi

name: Firefox and WebKit smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install one browser and build the publication
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          npx playwright install --with-deps "$BROWSER"
          python3 tools/strip-notes.py /tmp/site-smoke
      - name: Phone navigation, contents and reader smoke
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          DECK=$(node -p "require('./talks/talks.json').talks[0].slug")
          node tools/browser-smoke.mjs --root /tmp/site-smoke --publication --browser "$BROWSER" --decks "$DECK" --artifacts browser-artifacts
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.browser }}-failures
          path: browser-artifacts
          if-no-files-found: ignore

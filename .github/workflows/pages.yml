name: Validate and deploy

# Validation runs on every pull request and push to main; deployment happens
# only from main, and only after validation succeeds.
#
# build publishes an ALLOWLISTED, notes-free copy of the site (see
# tools/strip-notes.py) plus generated extras: a slides.pdf and a
# social-card.png per deck. PDFs/cards are cached and regenerated only when
# the deck or the shared engine changed (content-hash check inside
# tools/export-pdf.mjs).
#
# All actions use verified immutable commit pins with version comments;
# .github/dependabot.yml proposes updates. The one local
# action, .github/actions/setup-playwright, installs Chromium from a cache.
#
# External links are deliberately NOT checked here — see
# .github/workflows/link-check.yml, which does that weekly and off the merge
# path so a slow third-party host can never make a pull request flaky.
#
# One-time setup: repo Settings → Pages → Build and deployment →
# Source = "GitHub Actions" (instead of "Deploy from a branch").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pinned test tooling
        run: |
          npm ci
          python -m pip install -r requirements-test.txt

      - name: Unit tests (Python and Node)
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          npm test

      - name: Static checks (audit, vendored checksums, landing-page sync)
        run: |
          python3 tools/build-index.py --check
          python3 tools/audit.py --strict
          python3 tools/strip-notes.py /tmp/site-check
          python3 tools/audit.py --site /tmp/site-check --strict

      - uses: ./.github/actions/setup-playwright

      - name: Browser checks (1280×720, 844×390, 390×844)
        run: node tools/browser-check.mjs --artifacts browser-artifacts/source

      - name: Publication browser smoke
        run: node tools/browser-smoke.mjs --root /tmp/site-check --publication --artifacts browser-artifacts/publication

      - name: Offline export regressions
        run: node tools/browser-export-regression.mjs

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failures
          path: browser-artifacts
          if-no-files-found: ignore

  # Stable catalogue fixtures remain comparable when their authored content
  # changes. Intentional public-page differences need exact reviewed pixel
  # approvals; unexpected differences still fail and always produce artifacts.
  cross-browser:
    uses: ./.github/workflows/browser-smoke.yml

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Identify changes that affect appearance
        id: engine
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          if grep -qE '^(shared/|talks/|index\.html|404\.html|tools/(build-|capture-visual|visual-|lib/browser))' <<< "$CHANGED"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.engine.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Node tooling
        if: steps.engine.outputs.changed == 'true'
        run: npm ci

      - uses: ./.github/actions/setup-playwright
        if: steps.engine.outputs.changed == 'true'

      - name: Capture merge-base and proposed appearance
        if: steps.engine.outputs.changed == 'true'
        env:
          BASE: ${{ steps.engine.outputs.base }}
        run: |
          git worktree add /tmp/base-tree "$BASE"
          node tools/capture-visual.mjs --root /tmp/base-tree --fixtures /tmp/base-tree --out /tmp/shots-base
          node tools/capture-visual.mjs --root . --fixtures /tmp/base-tree --out /tmp/shots-head

      - name: Reject unexpected visual changes
        if: steps.engine.outputs.changed == 'true'
        env:
          BASE: ${{ steps.engine.outputs.base }}
        run: node tools/visual-diff.mjs --before /tmp/shots-base --after /tmp/shots-head --out /tmp/visual-diff --approvals tools/visual-approvals.json --base "$BASE"

      - name: Upload before, after and diff images
        if: always() && steps.engine.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-review
          path: |
            /tmp/visual-diff
            /tmp/shots-base
            /tmp/shots-head
          if-no-files-found: ignore

  build:
    needs: [validate, cross-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build the allowlisted, notes-free site
        run: |
          python3 tools/strip-notes.py _site
          python3 tools/audit.py --site _site --strict

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Node tooling
        run: npm ci

      - uses: ./.github/actions/setup-playwright

      # PDFs + social cards are expensive: restore the last run's outputs and
      # let export-pdf's content-hash check skip every unchanged deck.
      - name: Restore PDF/social-card cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .extras-cache
          key: deck-extras-${{ hashFiles('talks/**', 'shared/**', 'package-lock.json', 'tools/export-pdf.mjs', 'tools/lib/*.mjs') }}-${{ github.run_id }}
          restore-keys: deck-extras-

      - name: Export PDFs and social cards
        run: |
          node tools/sync-extras-cache.mjs --root _site --cache .extras-cache --restore
          node tools/export-pdf.mjs --root _site
          node tools/sync-extras-cache.mjs --root _site --cache .extras-cache --save

      - name: Check the completed publication and downloads
        run: node tools/browser-smoke.mjs --root _site --publication --exports --artifacts browser-artifacts

      - name: Upload publication failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-failures
          path: browser-artifacts
          if-no-files-found: ignore

      - name: Drop build-internal hash files
        run: |
          find _site -name .extras-hash -delete
          rm _site/.slides-build.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

name: Weekly vendored dependency check

on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compare vendored runtimes with stable upstream releases
        run: python3 tools/check-vendors.py --json > vendor-report.json
      - name: Publish the version report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vendor-versions
          path: vendor-report.json
      - name: Add the report to the run summary
        if: always()
        run: |
          echo 'Vendored runtime versions (read-only check; no files updated):' >> "$GITHUB_STEP_SUMMARY"
          cat vendor-report.json >> "$GITHUB_STEP_SUMMARY"
